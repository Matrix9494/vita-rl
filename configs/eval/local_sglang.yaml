# Local OpenAI-compatible endpoint used by the LAIR VitaBench diagnostics.
# `max_input_tokens` is enforced client-side by VitaBench's local request
# adapter; it is intentionally independent of SGLang's 262,144-token model
# context for Qwen3.5-4B.
default:
  base_url: http://127.0.0.1:30000/v1/chat/completions
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  repetition_penalty: 1.0
  n: 1
  max_input_tokens: 65536
  # The default is deliberately non-thinking.  The user simulator must never
  # put hidden reasoning into UserMessage.content.  The thinking variant below
  # is used only when an agent run explicitly opts into it.
  chat_template_kwargs:
    enable_thinking: false
  headers:
    Authorization: "Bearer EMPTY"
    Content-Type: "application/json"

models:
  - name: qwen35-4b-local
    max_tokens: 8192
    max_input_tokens: 65536

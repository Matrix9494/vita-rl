[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-1"
version = "0.1.0"
description = "A deterministic delayed-recall RL environment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["gymnasium>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]
